# Four GPUs: one for two segmentation actors, one shared by STTN and cuRobo, and two for DA3.
# Two EGL render actors use the cuRobo card.
robot: piper
name: bench4_sttn_balanced
episodes: datasets/node_bench100/episodes.txt
out: outputs
order: list
seed: 20261109
piece_frames: 600
approach: false

nodes:
  segment: {cards: 1, actors_per_card: 2}
  inpaint: {cards: 1, model: sttn}
  depth: {cards: 2, window: 1, frames_per_forward: 96}
  action: {ride: inpaint, actors_per_card: 1, gpu_share: 0.1, ik_method: base_ik_seq, batch_size: 8640}
  render: {actors: 2}
  cpu: {actors: 2}

io:
  readers_per_lane: 2
  queue_per_lane: 4
  queue_frames: 1200

memory:
  inflight: 64
  reserve_gb: 64
  object_store_gb: 120
