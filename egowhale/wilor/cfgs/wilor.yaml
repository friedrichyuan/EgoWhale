# WiLoR 唯一配置文件。路径相对于 EgoWhale 仓库根目录，GPU 编号为物理编号。
# MP4 -> DA3 -> WiLoR；带标注的 HDF5 请直接输入 Retarget。
#
# 分卡运行：bash scripts/run_wilor_split_multigpu.sh
# 单视频：bash scripts/wilor.sh /path/video.mp4 [output_dir]

# 同一视频在独立的 GPU 角色间并行。每张物理 GPU 分给一个角色。
split:
  input_dir: datasets/egodex_fixed500_18fps
  output_root: outputs/wilor_output
  profiles:
    basic:
      camera_gpus: [0, 1, 2]
      wilor_gpus: [3, 4, 5]
    refined:
      camera_gpus: [0]
      wilor_gpus: [1]
      mask_gpus: [2]
      optimizer_gpus: [3, 4]
  max_videos: 0
  max_inflight_videos: 5
  max_inflight_source_bytes: 1073741824  # 在途视频源文件合计，0 为关闭
  max_pending_hmp_per_video: 4
  prepare_workers: 2
  postprocess_workers: 2
  write_workers: 2
  heartbeat_seconds: 10

long_video:
  da3_max_views: 128          # 0 为关闭视图上限，抽帧仍受 depth_stride 控制
  da3_retry_views: [64, 32]  # CUDA OOM 时依次降低预算
  sam3_max_frames: 256        # 每窗保留最多 256 帧，窗口之间有重叠
  sam3_retry_frames: [128, 64]
  hmp_overlap: 16             # 固定 128 帧窗口中的重叠长度
save_depth_maps: false        # 手部节点只依赖相机参数，按需保留全尺寸深度图

# 手部模型与处理参数。长视频 depth_stride=1 可能导致 DA3 显存不足；
# 增大该值会采样帧并插值，结果与全帧推理可能不同。
# Hand-only experiment: SAM3 + AnyHand/WiLoR + tracking + DynHaMR/HMP.
# Run via scripts/run_hand_experiment.py, which resolves these paths.
mode: [hand]
hand_backend: anyhand
anyhand_backend: wilor
anyhand_root: thirdparty/AnyHand
dynhamr_enabled: false
dynhamr_required: false
hand_mode: full
dynhamr_root: thirdparty/Dyn-HaMR
# Empty means the same Python interpreter that launches this experiment.
dynhamr_python: ""
dynhamr_timeout: 7200
dynhamr_gpu: 0
dynhamr_z_min: 0.15
dynhamr_z_max: 0.4
dynhamr_gap_fill: 3
# HMP failure/length skip: validate smooth before replacing WiLoR.
# Offsets are measured relative to WiLoR 2D points / image diagonal, not GT error.
dynhamr_smooth_min_retained_ratio: 0.8
dynhamr_smooth_max_median_offset: 0.05
dynhamr_smooth_max_p95_offset: 0.15
dynhamr_smooth_min_visible_ratio: 0.5
anyhand_focal: 2500
hand_det_thresh: 0.3
min_hand_detection_rate: 0.10  # 关闭时序优化时每只手的最低有效帧比例
hand_overlay_points_only: true
sam3_checkpoint: thirdparty/sam3/checkpoints/sam3.pt
depth_model: da3giant
da3_model_root: thirdparty/da3/weights
da3_process_res: 504
depth_stride: 1
known_intrinsics: false
input_resolution: 480
output_resolution: 480
output_resize: true
debug: false
verbose: true
skip_existing: true
n_processes: 1
robot: Panda
gripper: Robotiq85
square: false
epic: false
bimanual_setup: shoulders
target_hand: both
constrained_hand: true
depth_for_overlay: false
render: false
camera_intrinsics: ""
camera_extrinsics: ""
data_root_dir: .
processed_data_root_dir: .
demo_name: ""

# 旧独立实验入口所需配置；与上面的同步流程分开读取。
legacy:
  # Full hand pipeline using pinned author masks/filter/tracking/jump methods.
  # Independent of the global batch configuration. Use a new output directory.
  # Known K: source=provided with a sized JSON, or source=egodex with explicit HDF5.
  camera:
    source: da3
    process_res: 336
    # Validated short-video profile on this server; library defaults remain 16/8.
    window: 128
    overlap: 8
  mask:
    enabled: true
    backend: author-video
    edge: true
  tracking:
    enabled: true
    method: author
  jump:
    enabled: true
    method: author
  refine:
    enabled: true
    run_prior: true
    boundary_trim: 3
    camera_mode: author-static
    opt_scale: false
    root_iters: 50
    smooth_iters: 300
    lbfgs_max_iter: 20
  depth_bounds:
    enabled: true
    min: 0.05
    max: 0.4
  gaps:
    enabled: true
  publish:
    stage: final
