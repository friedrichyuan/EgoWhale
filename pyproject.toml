[project]
name = "egowhale"
version = "0.1.0"
description = "Large-scale synthesis of dual-arm robot demonstrations from egocentric video."
requires-python = ">=3.12"
dependencies = [
    "numpy", "scipy", "opencv-python", "h5py", "pillow", "pyyaml", "omegaconf", "loguru",
    "torch", "mujoco", "ray", "tensorboard",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools.packages.find]
include = ["egowhale*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["thirdparty", "outputs", "datasets"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B905", "B007"]

[tool.ruff.lint.isort]
known-first-party = ["egowhale"]

[tool.ruff.lint.per-file-ignores]
"tools/*.py" = ["E402"]
